
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartStock - Inventory Management</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                SmartStock
            </a>

            <span class="text-white">
                Inventory Management System
            </span>
        </div>
    </nav>

    <div class="container mt-4">

        <!-- Dashboard Heading -->
        <h2 class="mb-4">Dashboard</h2>

        <!-- Statistics -->
        <div class="row g-3 mb-4">

            <div class="col-md-4">
                <div class="card stat-card bg-primary text-white">
                    <div class="card-body">
                        <h5>Total Products</h5>
                        <h2 id="totalProducts">0</h2>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card stat-card bg-success text-white">
                    <div class="card-body">
                        <h5>Total Stock</h5>
                        <h2 id="totalStock">0</h2>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card stat-card bg-warning text-dark">
                    <div class="card-body">
                        <h5>Low Stock Items</h5>
                        <h2 id="lowStock">0</h2>
                    </div>
                </div>
            </div>

        </div>

        <!-- Product Form -->
        <div class="card mb-4">
            <div class="card-header bg-dark text-white">
                <h5 id="formTitle">Add New Product</h5>
            </div>

            <div class="card-body">

                <form id="productForm">

                    <input type="hidden" id="productId">

                    <div class="row g-3">

                        <div class="col-md-6">
                            <label class="form-label">Product Name</label>
                            <input type="text" id="name"
                                class="form-control"
                                maxlength="100"
                                required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Category</label>
                            <input type="text" id="category"
                                class="form-control"
                                required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Price (₹)</label>
                            <input type="number" id="price"
                                class="form-control"
                                min="0" step="0.01"
                                required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Quantity</label>
                            <input type="number" id="quantity"
                                class="form-control"
                                min="0" step="1"
                                required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Description</label>
                            <input type="text" id="description"
                                class="form-control">
                        </div>

                    </div>

                    <button type="submit"
                        class="btn btn-primary mt-3"
                        id="submitButton">
                        Add Product
                    </button>

                    <button type="button"
                        class="btn btn-secondary mt-3"
                        id="cancelButton"
                        hidden>
                        Cancel
                    </button>

                </form>

            </div>
        </div>

        <!-- Product Table -->
        <div class="card mb-4">

            <div class="card-header bg-dark text-white">
                <h5>Product Inventory</h5>
            </div>

            <div class="card-body">

                <input type="text"
                    id="searchInput"
                    class="form-control mb-3"
                    placeholder="Search products...">

                <div class="table-responsive">

                    <table class="table table-bordered table-striped">

                        <thead class="table-primary">
                            <tr>
                                <th>Name</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Quantity</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody id="productTable">
                            <tr>
                                <td colspan="6" class="text-center">
                                    Loading products...
                                </td>
                            </tr>
                        </tbody>

                    </table>

                </div>
            </div>
        </div>

        <!-- Sales Form -->
        <div class="card mb-4">

            <div class="card-header bg-success text-white">
                <h5>Record New Sale</h5>
            </div>

            <div class="card-body">

                <form id="saleForm">

                    <div class="row g-3">

                        <div class="col-md-6">
                            <label class="form-label">
                                Select Product
                            </label>

                            <select id="saleProduct"
                                class="form-select"
                                required>
                                <option value="">
                                    Select a product
                                </option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">
                                Sale Quantity
                            </label>

                            <input type="number"
                                id="saleQuantity"
                                class="form-control"
                                min="1"
                                step="1"
                                required>
                        </div>

                        <div class="col-md-2 d-flex align-items-end">
                            <button type="submit"
                                class="btn btn-success w-100">
                                Record Sale
                            </button>
                        </div>

                    </div>

                </form>

            </div>
        </div>

        <!-- Sales History -->
        <div class="card mb-5">

            <div class="card-header bg-dark text-white">
                <h5>Sales History</h5>
            </div>

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-bordered">

                        <thead class="table-success">
                            <tr>
                                <th>Product</th>
                                <th>Quantity</th>
                                <th>Total Price</th>
                                <th>Date</th>
                            </tr>
                        </thead>

                        <tbody id="salesTable">
                            <tr>
                                <td colspan="4" class="text-center">
                                    No sales recorded
                                </td>
                            </tr>
                        </tbody>

                    </table>

                </div>
            </div>
        </div>

    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Custom JavaScript -->
    <script src="script.js"></script>

</body>
</html>
